<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link para o CSS -->
    <link rel="stylesheet" href="CSS/style.css">
    <script src="js/script.js"></script>


    
</head>   
<body>
<header>
    <h1>Gerenciador de Atividades da Secretaria</h1>

</header>
<div class="container">
    <h2>Pessoa</h2>
    <select id="Pessoa">
        <option value="A - coordenador">A - coordenador</option>
        <option value="G - operador">G - operador </option>
        <option value="B - operador">B - operador </option>
        <option value="M - encarregado">M - encarregado</option>
        <option value="P - serviço">P - serviço</option>
        <option value="R - serviço">R - serviço</option>
    </select>

    <h2>Atividade</h2>
    <select id="atividade">
                <option value="Atendimento dentro da Secetaria">Atendimento dentro da secretaria 📚</option>
        <option value="Atendimento fora Secretaria">Atendimento fora secretaria 🏃</option>
        <option value="Atendimento whatapp">Atendimento whatapp 📱</option>
        <option value="Atendimento  telefone">Atendimento Telefone 😄 </option>
        <option value="Mensagem aguardando transmissão">Mensagem aguardando transmissão 💻</option>
        <option value="Receber mensagem">Receber mensagem 🧩 </option>
        <option value="Receber mensagem por email">Receber mensagem  por email ✉️🧩  </option>
        <option value="Receber processos">Receber processos 📥</option>
        <option value="Receber processos por email">Receber processos por email ✉️📥</option>
        <option value="Trasmitir processo">Trasmitir processo 📤 </option>
        <option value="Trasmitir processo">Trasmitir processo por email ✉️📤 </option>
        <option value="Outros">Outros 📖</option>
    </select>
    <h3>Cronômetro</h3>
    <div class="timer-display" id="display">00:00:00</div>

    <div class="buttons">
        <button class="start" id="startBtn" onclick="start()">Iniciar</button>
        <button class="pause" id="pauseBtn" onclick="pause()" disabled>Pausar</button>
        <button class="save" id="saveBtn" onclick="saveActivity()" disabled>Salvar</button>
        <button class="reset" onclick="reset()">Resetar</button>
    </div>
</div>

<div class="history-container">
    <h3>Histórico de Atividades (2026)</h3>
    <table id="historyTable">
        <thead>
            <tr>
                <th>Data</th>
                <th>Pessoas</th>
                <th>Atividade</th>
                <th>Duração</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>
    <button onclick="downloadHistory()" class="btn-clear">Download Histórico</button>
</div>


</body>
</html>
